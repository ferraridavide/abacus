<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abacus — Save images</title>
    <link rel="stylesheet" href="shared.css" />
    <!-- paints the cached theme before the first frame; theme.js then syncs with the server -->
    <script src="theme-boot.js"></script>
    <link rel="stylesheet" href="batch.css" />
  </head>
  <body>
    <header class="bar">
      <span class="logo" role="img" aria-label="Abacus"><svg width="32" height="32" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square"><rect x="8" y="10" width="84" height="80"/><path d="M28 10v80M50 10v80M72 10v80M8 50h84"/><g fill="currentColor" stroke="none"><rect x="20" y="16" width="16" height="12"/><rect x="20" y="58" width="16" height="12"/><rect x="42" y="30" width="16" height="12"/><rect x="42" y="64" width="16" height="12"/><rect x="64" y="16" width="16" height="12"/><rect x="64" y="58" width="16" height="12"/></g></svg></span>
      <div class="bar-title">
        <h1>Save images to Abacus</h1>
        <p id="source" class="hint"></p>
      </div>
    </header>
    <p id="notice" class="notice" role="status" hidden></p>
    <main id="workspace" hidden>
      <aside class="panel">
        <section>
          <h2>Filter</h2>
          <div class="row">
            <label><span>Min width</span><input id="minWidth" type="number" min="0" step="10" inputmode="numeric" /></label>
            <label><span>Min height</span><input id="minHeight" type="number" min="0" step="10" inputmode="numeric" /></label>
          </div>
          <fieldset id="formats"><legend>Format</legend></fieldset>
        </section>
        <section>
          <h2>Save into</h2>
          <label><span>Folder</span><input id="folder" type="text" placeholder="Library (no folder)" /></label>
          <label><span>Tags</span><input id="tags" type="text" placeholder="inspiration, design" /></label>
        </section>
        <section class="actions">
          <div class="row">
            <button id="select-all" type="button" class="btn">Select all</button>
            <button id="select-none" type="button" class="btn">Select none</button>
          </div>
          <button id="save" type="button" class="btn primary" disabled>Save</button>
          <progress id="progress" max="1" value="0" hidden></progress>
          <p id="result" class="status" role="status" hidden></p>
        </section>
      </aside>
      <section class="results">
        <p id="count" class="hint"></p>
        <div id="grid" class="grid"></div>
      </section>
    </main>
    <script type="module" src="batch.js"></script>
    <script type="module" src="autocomplete-init.js"></script>
  </body>
</html>
